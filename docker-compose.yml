services:
  turnstile-solver:
    build:
      context: .
      dockerfile: Dockerfile
    image: turnstile-solver-api:latest
    container_name: turnstile_solver_api
    restart: unless-stopped
    ports:
      - "5072:5072"
    environment:
      - PYTHONUNBUFFERED=1
      - PORT=5072
      - HOST=0.0.0.0
    command: ["--host", "0.0.0.0", "--port", "5072", "--browser_type", "chromium", "--thread", "2"]
    volumes:
      - ./results.db:/app/results.db
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:5072/openapi.json || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
