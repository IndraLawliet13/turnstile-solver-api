name: Python CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test-and-lint:
    name: Test & Lint (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12']

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -r requirements.txt
          pip install flake8

      - name: Syntax check
        run: |
          python -m py_compile api_solver.py browser_configs.py db_results.py

      - name: Lint with flake8 (syntax errors & warnings)
        run: |
          # stop the build if there are Python syntax errors or undefined names
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics --exclude=.venv,build,dist
          # exit-zero treats all errors as warnings.
          flake8 . --count --exit-zero --max-complexity=15 --max-line-length=160 --statistics --exclude=.venv,build,dist

      - name: Import smoke check
        run: |
          python - <<'PY'
          import api_solver
          import browser_configs
          import db_results
          print('imports-ok')
          PY

      - name: Run automated unit test suite
        run: |
          python -m unittest discover -s tests -p "test_*.py" -v
